name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка
        run: dotnet build HvBackup.csproj -c Release -v minimal

      - name: Самопроверка
        shell: pwsh
        run: |
          # exe помечен requireAdministrator: в CI UAC-эскалация не пройдёт.
          # Запускаем через dotnet — манифест на управляемую сборку не действует.
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:DOTNET_NOLOGO = '1'
          dotnet .\bin\Release\net8.0-windows\HvBackup.dll --selftest
          $code = $LASTEXITCODE
          Write-Host "---- подробный отчёт (UTF-8) ----"
          $f = Join-Path $env:TEMP 'hvbackup-selftest.txt'
          if (Test-Path $f) { Get-Content $f -Encoding UTF8 }
          Write-Host "---- код возврата: $code ----"
          exit $code

      - name: Скриншоты интерфейса
        shell: pwsh
        run: |
          # --preview рисует окно программы в PNG на демо-данных.
          # 01 и 02 — настоящие снимки, их не трогаем.
          New-Item -ItemType Directory -Force -Path docs\screenshots | Out-Null
          $dll = ".\bin\Release\net8.0-windows\HvBackup.dll"
          dotnet $dll --preview "docs\screenshots\03-nastroyki.png" --settings
          dotnet $dll --preview "docs\screenshots\04-vosstanovlenie.png" --restore
          dotnet $dll --preview "docs\screenshots\05-raspisanie.png" --schedule
          Get-ChildItem docs\screenshots\*.png | Select-Object Name,Length

      - name: Сохранить скриншоты в репозиторий
        shell: pwsh
        run: |
          # Скриншоты 01 и 02 — настоящие снимки, не трогаем.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/03-nastroyki.png docs/screenshots/04-vosstanovlenie.png docs/screenshots/05-raspisanie.png
          if (git diff --staged --quiet) {
            Write-Host "Скриншоты не изменились"
          } else {
            git commit -m "docs: обновление скриншотов [skip ci]"
            git push
          }

      - name: Артефакт скриншотов
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png

      - name: Отчёт
        run: Get-ChildItem .\bin\Release\net8.0-windows\HvBackup.exe | Select-Object Name,Length

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: HvBackup-win-x64
          path: bin/Release/net8.0-windows/HvBackup.exe
